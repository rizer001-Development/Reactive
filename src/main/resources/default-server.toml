# Reactive Server Configuration (server.toml)
# Edit values and RESTART the server to apply changes.
# This file is never rewritten by the server. Delete it to regenerate defaults.

# ============================================================
# [server] — main server settings
# ============================================================
[server]
# Port to listen on
server-port = 25565

# IP to bind to (empty = all interfaces)
server-ip = ""

# Max players
max-players = 20

# Online mode (verify accounts with Mojang)
online-mode = false

# Message of the day
motd = "A Reactive Server"

# World name
level-name = "world"

# World seed (empty = random)
level-seed = ""

# World type: normal, flat, large_biomes, amplified
level-type = "minecraft:normal"

# difficulty: peaceful, easy, normal, hard
difficulty = "easy"

# gamemode: survival, creative, adventure, spectator
gamemode = "survival"

# Hardcore mode (forces difficulty hard + death ban)
hardcore = false

# Player vs player combat
pvp = true

# Allow flight in survival
allow-flight = false

# Nether dimension access
allow-nether = true

# Generate structures (villages, strongholds...)
generate-structures = true

# Custom generator settings (JSON, empty = default)
generator-settings = ""

# Spawn animals
spawn-animals = true

# Spawn monsters
spawn-monsters = true

# Spawn villagers etc
spawn-npcs = true

# Spawn protection radius in blocks (0 = off)
spawn-protection = 16

# Max world size in blocks (radius from center)
max-world-size = 29999984

# View distance in chunks (3-32)
view-distance = 10

# Simulation distance in chunks (5-32)
simulation-distance = 10

# Network compression threshold (-1 = off, 0 = compress all, 256 default)
network-compression-threshold = 256

# Max tick time before watchdog crash (ms, -1 = disable watchdog)
max-tick-time = 60000

# Packet rate limit (0 = no limit)
rate-limit = 0

# Sync chunk writes (enable for safer saves)
sync-chunk-writes = true

# Use epoll/kqueue native transport (Linux/macOS)
use-native-transport = true

# Show the server in the public server list
enable-status = true

# Enforce whitelist after kick
enforce-whitelist = false

# Whitelist enabled
white-list = false

# Force gamemode on join
force-gamemode = false

# Prevent proxy connections
prevent-proxy-connections = false

# Max chained neighbor updates (performance)
max-chained-neighbor-updates = 1000000

# OP permission level (1-4)
op-permission-level = 4

# Function permission level (1-4)
function-permission-level = 2

# Player idle timeout (minutes, 0 = disabled)
player-idle-timeout = 0

# Enforce secure profile (signed chat)
enforce-secure-profile = true

# Hide online player count in server list ping
hide-online-players = false

# Data packs enabled on first world creation
initial-enabled-packs = "vanilla"

# Data packs disabled on first world creation
initial-disabled-packs = ""

# Resource pack URL (empty = none)
resource-pack = ""

# Resource pack SHA1 (empty = none)
resource-pack-sha1 = ""

# Require the resource pack
resource-pack-required = false

# Resource pack prompt message (empty = none)
resource-pack-prompt = ""

# Accept player transfers (0 = off)
accepts-transfers = false

# Broadcast console to ops
broadcast-console-to-ops = true

# Broadcast RCON console to ops
broadcast-rcon-to-ops = true

# Bug report link (empty = none)
bug-report-link = ""

# Chat spam threshold (seconds)
chat-spam-threshold-seconds = 10

# Command spam threshold (seconds)
command-spam-threshold-seconds = 10

# Enable code of conduct screen
enable-code-of-conduct = false

# Enable JMX monitoring
enable-jmx-monitoring = false

# Enable query protocol
enable-query = false

# Enable RCON
enable-rcon = false

# Log player IPs
log-ips = true

# Pause server when empty (seconds, -1 = disabled)
pause-when-empty-seconds = 60

# Entity broadcast range percentage (10-1000)
entity-broadcast-range-percentage = 100

# Region file compression: deflate, lz4
region-file-compression = "deflate"

# Status heartbeat interval (0 = default)
status-heartbeat-interval = 0

# Text filtering config (JSON, empty = none)
text-filtering-config = ""

# Text filtering version (0 = off)
text-filtering-version = 0

# ============================================================
# [network] — query & rcon networking
# ============================================================
[network]
# Query protocol port
query-port = 25565

# RCON port
rcon-port = 25575

# RCON password (empty = disabled even if enable-rcon is true)
rcon-password = ""

# ============================================================
# [management] — experimental management server (26.2)
# ============================================================
[management]
# Enable management server
enabled = false

# Bind host
host = "localhost"

# Bind port (0 = ephemeral)
port = 0

# API secret (empty = auto-generated at runtime)
secret = ""

# TLS enabled
tls-enabled = true

# TLS keystore path (empty = default)
tls-keystore = ""

# TLS keystore password
tls-keystore-password = ""

# Allowed CORS origins
allowed-origins = ""
